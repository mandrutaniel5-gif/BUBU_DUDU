# Build-uri automate: Web (PWA + fisier unic), Windows (.exe), Android (.apk pentru testeri + .aab pentru Google Play), iOS (.ipa nesemnat).
# Ruleaza la fiecare push pe main si manual (Actions -> Build -> Run workflow).
# La un tag v* (ex. v1.0.0) fisierele sunt puse si intr-un Release.
name: Build
on:
  push:
    branches: [main]
    paths-ignore: ['server-url.txt', 'docs/**', 'tools/teste/**', 'README.md']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# un singur build odata pe aceeasi ramura (altfel se calca pe gh-pages)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:single && cp dist-single/index.html BubuDudu-joc.html
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/ }
      - uses: actions/upload-artifact@v4
        with: { name: BubuDudu-joc-html, path: BubuDudu-joc.html }
      # jocul compilat merge si pe ramura gh-pages: GitHub Pages (joc online) + serverul de pe S10 il descarca de aici
      - name: Publica pe gh-pages
        id: pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
      # a doua incercare (uneori push-ul pe gh-pages pica o data din cauza retelei sau a altui build)
      - name: Publica pe gh-pages (a doua incercare)
        if: github.ref == 'refs/heads/main' && steps.pages.outcome == 'failure'
        run: sleep 20
      - name: Publica pe gh-pages (reincercare)
        if: github.ref == 'refs/heads/main' && steps.pages.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build Windows
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          npm run dist:win 2>&1 | tee build.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then echo "::error::$(tail -c 1500 build.log | tr '\n' ' ')"; exit $code; fi
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: release/*.exe }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      # Google Play cere din 31 aug 2026 Android 16 (API 36): doar aplicatia de Android merge pe Capacitor 8 (iOS ramane pe 6)
      - run: npm i --no-save --legacy-peer-deps @capacitor/cli@8.6.0 @capacitor/core@8.6.0 @capacitor/android@8.6.0
      - run: npx cap add android
      - run: npx cap sync android
      - name: Versiunea aplicatiei (din package.json; Play cere un numar mai mare la fiecare incarcare)
        run: |
          V=$(node -p "require('./package.json').version"); IFS=. read -r A B C <<< "$V"; CODE=$((A * 10000 + B * 100 + C))
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName|targetSdk|compileSdk" android/app/build.gradle android/variables.gradle || true
      - name: Ecran complet de joc (fara barele telefonului)
        run: python3 ci/android_patch.py android
      - name: Doar pe orizontala
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Pictograma aplicatiei
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp public/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Cheia de semnare (din Secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::Lipseste secretul ANDROID_KEYSTORE_BASE64 - APK-ul va fi semnat doar cu cheia de debug"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
      - name: Build APK (testeri) si AAB (Google Play)
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eo pipefail
          exec > >(tee /tmp/b.log) 2>&1
          trap 'sleep 1; echo "::error::$(tail -c 1500 /tmp/b.log | tr "\n" " ")"' ERR
          chmod +x gradlew
          # APK-ul pentru testeri: mereu cu aceeasi cheie de test, ca versiunile noi sa se instaleze PESTE cea veche (lumile raman)
          mkdir -p ~/.android && cp ../ci/debug.keystore ~/.android/debug.keystore
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BubuDudu.apk
          # AAB-ul pentru Google Play: semnat cu cheia de incarcare (din Secrets); fara cheie nu se poate urca in Play
          if [ -f app/release.jks ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="${KS_ALIAS:-bubududu}" \
              -Pandroid.injected.signing.key.password="$KS_PASS"
            cp app/build/outputs/bundle/release/app-release.aab ../BubuDudu.aab
          else
            echo "::warning::Lipseste cheia de incarcare (ANDROID_KEYSTORE_BASE64): fara AAB pentru Google Play"
          fi
          rm -f app/release.jks
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: BubuDudu.apk }
      - uses: actions/upload-artifact@v4
        with: { name: android-aab, path: BubuDudu.aab, if-no-files-found: ignore }

  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Joc pe orizontala, Game Mode, sunetul care nu se opreste
        run: python3 ci/ios_patch.py ios/App/App
      - name: Build .ipa (nesemnat)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # verificare: versiunea jocului si iconita sunt in aplicatie
          V=$(node -p "require('../../package.json').version")
          GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/App.app/Info.plist)
          echo "Versiune in aplicatie: $GOT (build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/App.app/Info.plist)), package.json: $V"
          ls Payload/App.app | grep -i appicon
          [ "$GOT" = "$V" ] || { echo "::error::Versiunea din aplicatia iOS ($GOT) nu e $V"; exit 1; }
          ls Payload/App.app | grep -qi appicon || { echo "::error::Lipseste iconita din aplicatia iOS"; exit 1; }
          zip -qr ../../BubuDudu-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios-ipa, path: BubuDudu-unsigned.ipa }

  release:
    # Release automat cu versiunea din package.json (ex. v1.0.0) la fiecare push pe main.
    # Iese si daca iOS nu s-a putut construi (GitHub nu are mereu servere Mac libere).
    if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.web.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    needs: [web, windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Nume cu versiunea
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p up
          cp art/android-apk/BubuDudu.apk up/BubuDudu-$V-android.apk
          if [ -f art/android-aab/BubuDudu.aab ]; then cp art/android-aab/BubuDudu.aab up/BubuDudu-$V-google-play.aab; fi
          if [ -f art/ios-ipa/BubuDudu-unsigned.ipa ]; then cp art/ios-ipa/BubuDudu-unsigned.ipa up/BubuDudu-$V-ios-unsigned.ipa; else echo "::warning::iOS nu s-a construit de data asta (lipsa server Mac la GitHub)"; fi
          cp art/BubuDudu-joc-html/BubuDudu-joc.html up/BubuDudu-$V-web.html
          cp art/windows-exe/*.exe up/
          ls -la up
      - id: rel
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Bubu & Dudu ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            🐼🐻 Bubu & Dudu ${{ steps.v.outputs.version }}
            - Windows: BubuDudu-Setup (instalare) sau BubuDudu-Portable (fără instalare)
            - Android: BubuDudu-…-android.apk (testeri) · BubuDudu-…-google-play.aab (pentru Google Play Console)
            - iOS: …-ios-unsigned.ipa (se instalează cu AltStore / Sideloadly)
            - Browser: …-web.html (un singur fișier, merge offline)
          files: up/*
      # a doua incercare (GitHub mai refuza uneori pe moment)
      - if: steps.rel.outcome == 'failure'
        run: sleep 45
      - if: steps.rel.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Bubu & Dudu ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            🐼🐻 Bubu & Dudu ${{ steps.v.outputs.version }}
            - Windows: BubuDudu-Setup (instalare) sau BubuDudu-Portable (fără instalare)
            - Android: BubuDudu-…-android.apk (testeri) · BubuDudu-…-google-play.aab (pentru Google Play Console)
            - iOS: …-ios-unsigned.ipa (se instalează cu AltStore / Sideloadly)
            - Browser: …-web.html (un singur fișier, merge offline)
          files: up/*
